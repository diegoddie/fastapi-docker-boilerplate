name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lockfile, dependencies and shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the lockfile is up to date
        run: uv lock --check
      - name: Check the dependencies for known vulnerabilities
        run: ./scripts/audit.sh
      - name: Lint the shell scripts
        run: shellcheck scripts/*.sh

  test:
    name: Lint, type check and test
    runs-on: ubuntu-latest
    env:
      BACKEND_BUILD_TARGET: test
      # Not a real secret: it only signs the tokens of the throwaway test database.
      FASTAPI_SECRET_KEY: ci-only-secret-key-for-the-test-suite-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Why: the image layers are cached between runs, so only what changed is
      # rebuilt; compose.yaml stays the single description of the build.
      - name: Build
        uses: docker/bake-action@v6
        with:
          source: .
          files: compose.yaml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
      - name: Test
        run: docker compose run --name backend_test backend
      # copier:celery:start
      - name: Check a worker runs a job
        run: ./scripts/check_worker.sh
      # copier:celery:end
      - name: Copy coverage report
        if: always()
        run: docker cp backend_test:/app/htmlcov htmlcov || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: htmlcov
          path: htmlcov
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose down -v
