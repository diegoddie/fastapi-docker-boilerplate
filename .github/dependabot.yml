version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Why: by default Dependabot may widen a `~=` pin into a `>=x,<y` range;
    # increase rewrites the pin to the new version instead, keeping one style.
    versioning-strategy: increase
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
