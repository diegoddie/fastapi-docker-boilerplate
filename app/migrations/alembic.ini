# Alembic configuration, located through the ALEMBIC_CONFIG env var.
# The database URL comes from the app settings (see env.py).

[alembic]
script_location = app/migrations
# Why: optional modules with tables keep their migrations in a branch of their
# own, in a folder of their own, listed one per line (see docs/adr/0014).
version_locations =
    %(here)s/versions
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = newline

[post_write_hooks]
hooks = ruff-format,ruff-fix
ruff-format.type = exec
ruff-format.executable = ruff
ruff-format.options = format REVISION_SCRIPT_FILENAME
ruff-fix.type = exec
ruff-fix.executable = ruff
ruff-fix.options = check --fix REVISION_SCRIPT_FILENAME
