[project]
name = "fastapi-docker-boilerplate"
version = "0.1.0"
description = "Production-ready FastAPI boilerplate: async SQLModel, PostgreSQL, uv, Docker and 100% test coverage."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic~=1.20.0",
    "alembic-postgresql-enum~=1.10.0",
    "fastapi[standard-no-fastapi-cloud-cli]~=0.143.0",
    "psycopg~=3.3.6",
    "pydantic-settings~=2.15.0",
    "sqlalchemy[asyncio]~=2.1.4",
    "sqlmodel~=0.0.48",
    "uvicorn[standard]~=0.54.0",
]

[dependency-groups]
remote = [
    "sentry-sdk~=2.71.0",
    "uvicorn-worker~=0.4.0",
]
test = [
    "bandit[toml]~=1.9.4",
    "coverage[toml]~=7.16.2",
    "mypy~=2.4.0",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "pytest-cov~=7.1.0",
    "pytest-mock~=3.16.0",
    "pytest-random-order~=1.2.0",
    "pytest-sugar~=1.1.1",
    "pytest-xdist~=3.8.0",
    "ruff~=0.16.10",
]
local = [
    "ipython~=9.17.1",
    "pre-commit~=4.6.2",
    "psycopg[binary,pool]~=3.3.6",
    "pyclean~=3.7.0",
    "rust-just~=1.58.0",
]

[tool.bandit]
exclude_dirs = [".venv", "tests"]

[tool.coverage.html]
title = "FastAPI Docker Boilerplate - Coverage"

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
concurrency = ["greenlet", "thread"]
disable_warnings = ["no-data-collected"]
omit = [".venv/*", "app/migrations/*"]
parallel = true
source = ["."]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = "--random-order-bucket=global"

[tool.ruff]
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = ["D203", "D212"]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # McCabe cyclomatic complexity
    "FAST", # flake8-fastapi
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T",    # flake8-debugger / flake8-print
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"app/migrations/*.py" = ["D100", "D101", "D102", "D104"]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["fastapi"]

[tool.mypy]
enable_error_code = ["truthy-bool"]
exclude = ["app/migrations/versions"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true
