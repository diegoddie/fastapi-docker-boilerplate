services:
  backend:
    build:
      args:
        USER: ${USER:-appuser}
      context: .
      target: ${BACKEND_BUILD_TARGET:-remote}
    image: ${BACKEND_IMAGE_NAME:-boilerplate_backend}:${BACKEND_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    # Why: the worker and beat share this environment.  # copier:celery
    environment: &backend-environment
      - FASTAPI_CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}  # copier:celery
      - FASTAPI_CELERY_WORKER_CONCURRENCY  # copier:celery
      - FASTAPI_CORS_ALLOWED_ORIGINS
      - FASTAPI_DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/boilerplate}
      - FASTAPI_DEBUG
      - FASTAPI_EMAIL_BACKEND
      - FASTAPI_EMAIL_FROM
      - FASTAPI_ENVIRONMENT=${FASTAPI_ENVIRONMENT:-remote}
      - FASTAPI_FRONTEND_URL
      - FASTAPI_GOOGLE_CLIENT_ID
      - FASTAPI_LOG_FORMAT
      - FASTAPI_LOG_LEVEL
      - FASTAPI_SECRET_KEY
      - FASTAPI_SENTRY_TRACES_SAMPLE_RATE  # copier:sentry
      - FASTAPI_SMTP_HOST
      - FASTAPI_SMTP_PASSWORD
      - FASTAPI_SMTP_PORT
      - FASTAPI_SMTP_SECURITY
      - FASTAPI_SMTP_USERNAME
      - FORWARDED_ALLOW_IPS
      - INTERNAL_SERVICE_PORT=${BACKEND_SERVICE_PORT:-8000}
      - PYTHONBREAKPOINT
      - PYTHONDEVMODE
      - SENTRY_DSN  # copier:sentry
      - SENTRY_ENVIRONMENT  # copier:sentry
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_SERVICE_PORT:-8000}"
    user: ${USER:-appuser}

  # copier:celery:start
  beat:
    command: ["celery", "--app", "app.jobs.worker", "beat"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *backend-environment
    # Why: the image's health check probes the web server, which this service
    # does not run.
    healthcheck:
      disable: true
    image: ${BACKEND_IMAGE_NAME:-boilerplate_backend}:${BACKEND_IMAGE_TAG:-latest}
    # Why: the backend service builds this image; there is nothing to pull.
    pull_policy: never
    user: ${USER:-appuser}

  # copier:celery:end
  postgres:
    environment:
      - POSTGRES_DB=boilerplate
      - POSTGRES_INITDB_ARGS=--no-sync
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 10
      start_period: 20s
    image: postgres:18-bookworm
    volumes:
      - pg_data:/var/lib/postgresql

  # copier:celery:start
  redis:
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      retries: 10
    image: valkey/valkey:9-trixie

  worker:
    command: ["celery", "--app", "app.jobs.worker", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *backend-environment
    # Why: the image's health check probes the web server, which this service
    # does not run.
    healthcheck:
      disable: true
    image: ${BACKEND_IMAGE_NAME:-boilerplate_backend}:${BACKEND_IMAGE_TAG:-latest}
    # Why: the backend service builds this image; there is nothing to pull.
    pull_policy: never
    # Why: on stop, the worker finishes the tasks it is running (a few seconds
    # when idle) before it is killed; as long as Kubernetes' default.
    stop_grace_period: 30s
    user: ${USER:-appuser}

  # copier:celery:end
volumes:
  pg_data: {}
