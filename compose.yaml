services:
  backend:
    build:
      args:
        USER: ${USER:-appuser}
      context: .
      target: ${BACKEND_BUILD_TARGET:-remote}
    image: ${BACKEND_IMAGE_NAME:-boilerplate_backend}:${BACKEND_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - FASTAPI_CORS_ALLOWED_ORIGINS
      - FASTAPI_DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/boilerplate}
      - FASTAPI_DEBUG
      - FASTAPI_EMAIL_BACKEND
      - FASTAPI_EMAIL_FROM
      - FASTAPI_ENVIRONMENT=${FASTAPI_ENVIRONMENT:-remote}
      - FASTAPI_FRONTEND_URL
      - FASTAPI_GOOGLE_CLIENT_ID
      - FASTAPI_LOG_FORMAT
      - FASTAPI_LOG_LEVEL
      - FASTAPI_SECRET_KEY
      - FASTAPI_SMTP_HOST
      - FASTAPI_SMTP_PASSWORD
      - FASTAPI_SMTP_PORT
      - FASTAPI_SMTP_SECURITY
      - FASTAPI_SMTP_USERNAME
      - FORWARDED_ALLOW_IPS
      - INTERNAL_SERVICE_PORT=${BACKEND_SERVICE_PORT:-8000}
      - PYTHONBREAKPOINT
      - PYTHONDEVMODE
      - SENTRY_DSN
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_SERVICE_PORT:-8000}"
    user: ${USER:-appuser}

  postgres:
    environment:
      - POSTGRES_DB=boilerplate
      - POSTGRES_INITDB_ARGS=--no-sync
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 10
      start_period: 20s
    image: postgres:18-bookworm
    volumes:
      - pg_data:/var/lib/postgresql

volumes:
  pg_data: {}
